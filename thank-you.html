<style>
:root{--ink:#0B2644;--ink-soft:#44506A;--sheet:#F5F4EF;--signal:#F1A801;--signal-deep:#D39200;--grid:rgba(20,33,61,.07)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--sheet)}
.card{max-width:560px;width:100%;background:#F5F4EF;border:2px solid var(--ink);padding:clamp(28px,5vw,48px)}
.mark{margin-bottom:24px}
h1{font-stretch:120%;font-size:clamp(1.8rem,4vw,2.4rem);line-height:1.1;margin:0 0 14px}
p{color:var(--ink-soft);font-size:1.1rem;line-height:1.6;margin:0 0 12px}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.btn{display:inline-flex;align-items:center;font:inherit;font-weight:650;text-decoration:none;padding:13px 20px;border-radius:4px;border:2px solid var(--ink);color:var(--ink)}
.btn-primary{background:var(--signal);border-color:var(--signal)}
.btn-primary:hover{background:var(--signal-deep);border-color:var(--signal-deep)}
.btn:focus-visible{outline:3px solid var(--signal);outline-offset:3px}
</style>
